<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="resources/images/icons/favicon.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="resources/images/icons/favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="resources/images/icons/apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
  <title>Social | Brian Crink</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --page-bg: #000000;
      --page-fg: #ffffff;
      --hero-compact: 0;
      --compact-range: 160px;
      --image-x: -9px;
      --image-y: 13px;
      --image-slot: 148px;
      --tool-collapse: 138px;
      --chrome-expanded: 420px;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      max-height: 100%;
      overflow: hidden;
      background-color: var(--page-bg);
      color: var(--page-fg);
      transition: background-color 0.45s ease, color 0.45s ease;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--page-bg);
      color: var(--page-fg);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 1.3s forwards;
    }

    body.light,
    html:has(body.light) {
      --page-bg: #ffffff;
      --page-fg: #1a1a1a;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .social-row.view-entering > .social-group > h2,
    .social-row.view-entering .social-item {
      opacity: 0;
      animation: fadeIn 1.1s forwards;
      animation-delay: calc(var(--col, 0) * 0.14s);
    }

    @property --pc1 { syntax: '<color>'; inherits: false; initial-value: #ff006e; }
    @property --pc2 { syntax: '<color>'; inherits: false; initial-value: #8338ec; }
    @property --pc3 { syntax: '<color>'; inherits: false; initial-value: #3a86ff; }
    @property --pc4 { syntax: '<color>'; inherits: false; initial-value: #06d6a0; }
    @property --pc5 { syntax: '<color>'; inherits: false; initial-value: #ffbe0b; }

    @keyframes portalChromaFade {
      0%   { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
      20%  { --pc1: #ffbe0b; --pc2: #ff006e; --pc3: #8338ec; --pc4: #3a86ff; --pc5: #06d6a0; }
      40%  { --pc1: #06d6a0; --pc2: #ffbe0b; --pc3: #ff006e; --pc4: #8338ec; --pc5: #3a86ff; }
      60%  { --pc1: #3a86ff; --pc2: #06d6a0; --pc3: #ffbe0b; --pc4: #ff006e; --pc5: #8338ec; }
      80%  { --pc1: #8338ec; --pc2: #3a86ff; --pc3: #06d6a0; --pc4: #ffbe0b; --pc5: #ff006e; }
      100% { --pc1: #ff006e; --pc2: #8338ec; --pc3: #3a86ff; --pc4: #06d6a0; --pc5: #ffbe0b; }
    }

    .site-nav-link.portal {
      background-image: linear-gradient(
        90deg,
        var(--pc1),
        var(--pc2),
        var(--pc3),
        var(--pc4),
        var(--pc5)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: portalChromaFade 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-nav-link.portal {
        animation: none;
      }
    }

    .site-nav {
      margin: 0;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 0.16rem;
    }

    body.light .site-nav {
      color: #1a1a1a;
    }

    .site-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin: 0;
    }

    .site-nav .portal {
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 0.08rem;
    }

    .site-nav-link.life {
      color: #7dd3fc;
      -webkit-text-fill-color: #7dd3fc;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04rem;
    }

    .site-nav-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .site-nav-link:hover {
      opacity: 0.85;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      text-decoration: none;
      line-height: 0;
    }

    .map-link:hover {
      opacity: 0.85;
    }

    .map-icon {
      width: 3.0rem;
      height: 3.0rem;
      display: block;
    }

    .name {
      font-size: 3.0rem;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    body.light .name {
      color: #1a1a1a;
    }

    .name-link {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .name-link:hover {
      opacity: 0.85;
    }

    h2 {
      font-size: 1.5rem;
      margin: 50px auto 20px;
      font-weight: 600;
      white-space: nowrap;
      color: #ffffff;
      text-align: center;
    }

    body.light h2 {
      color: #1a1a1a;
    }

    .icons {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 24px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .icon img {
      width: 45px;
      height: 45px;
      transition: transform 0.2s;
    }

    .icon:hover img {
      transform: scale(1.15);
    }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 40;
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.3s;
      margin: 0;
      display: block;
      color: #ffffff;
    }

    .toggle-btn:hover {
      transform: rotate(20deg);
    }

    body.light .toggle-btn {
      color: #1a1a1a;
    }

    .toggle-btn svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    @media (max-width: 768px) {
      .toggle-btn {
        top: 16px;
        right: 12px;
      }
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      width: 100%;
      padding: 12px 20px 0;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #scroller {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--chrome-expanded);
      bottom: 0;
      z-index: 1;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 48px;
      text-align: center;
    }

    .hero {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0;
    }

    .profile-image {
      position: absolute;
      left: 50%;
      top: var(--image-y);
      width: 160px;
      max-width: 160px;
      height: auto;
      margin: 0;
      transform: translateX(calc(-50% + var(--image-x)));
      z-index: 1;
      pointer-events: none;
    }

    .view-toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 0;
      position: relative;
      z-index: 4;
      width: 100%;
      padding-top: calc(var(--image-slot) - (var(--hero-compact) * var(--tool-collapse)));
    }

    .mode-toggle {
      position: relative;
      display: inline-flex;
      width: max-content;
      max-width: calc(100% - 24px);
      background: rgba(255, 255, 255, 0.146);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 4px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      isolation: isolate;
      z-index: 4;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    body.light .mode-toggle {
      background: rgba(0, 0, 0, 0.08);
      border-color: rgba(0, 0, 0, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: var(--slider-l, 4px);
      width: var(--slider-w, 33%);
      background: rgba(255, 255, 255, 0.18);
      border-radius: 46px;
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: center;
      will-change: left, width, transform;
      z-index: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle-slider {
        transition: left 0.2s ease, width 0.2s ease, background 0.3s ease;
      }
    }

    .mode-toggle.follow .toggle-slider {
      background: rgba(125, 211, 252, 0.55);
    }

    .mode-toggle.join .toggle-slider {
      background: rgba(63, 143, 78, 0.65);
    }

    .mode-toggle.connect .toggle-slider {
      background: rgba(255, 176, 74, 0.7);
    }

    body.light .mode-toggle.follow .toggle-slider {
      background: rgba(14, 165, 233, 0.55);
    }

    body.light .mode-toggle.join .toggle-slider {
      background: rgba(63, 143, 78, 0.6);
    }

    body.light .mode-toggle.connect .toggle-slider {
      background: rgba(255, 176, 74, 0.65);
    }

    .toggle-option {
      position: relative;
      flex: 0 0 auto;
      padding: 8px 16px;
      min-width: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      border-radius: 46px;
      z-index: 2;
      transition: color 0.2s ease;
      background: transparent;
      border: 0;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .toggle-option svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
      stroke: none;
    }

    /* Dark mode: white icons. Light mode: black icons. */
    .toggle-option.active { color: #ffffff; }
    .toggle-option.inactive { color: rgba(255, 255, 255, 0.7); }
    body.light .toggle-option.active { color: #000000; }
    body.light .toggle-option.inactive { color: rgba(0, 0, 0, 0.62); }

    .toggle-label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .divider {
      width: 70%;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.2);
      margin: 32px auto -14px;
      border: 0;
    }

    body.light .divider {
      background-color: rgba(0, 0, 0, 0.15);
    }

    /* Desktop only: divider 40% narrower (70% -> 42%); mobile unchanged */
    @media (min-width: 769px) {
      .divider { width: 42%; }
    }

    .social-group {
      display: none;
      width: 100%;
      text-align: center;
    }

    body[data-view="follow"] .group-follow,
    body[data-view="join"] .group-join,
    body[data-view="connect"] .group-connect {
      display: block;
    }

    .social-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    @media (max-width: 949px) {
      .icon img {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body data-view="follow">

          <g clip-path="url(#mapFillPortal)">

        </svg></a>
        <a href="https://portal.briancrink.com/#life" class="site-nav-link life">LifeOS</a>
      </p>
    </div>

    <h1 class="name"><a href="https://briancrink.com" class="name-link">Brian Crink</a></h1>

    <div class="hero">
      <img src="resources/images/profile/profile_face.png" alt="Brian Crink" class="profile-image" draggable="false" data-fallback-src="https://raw.githubusercontent.com/briancrink/resources.briancrink.com/main/images/profile/profile_emoji_face.png" onerror="if(!this.dataset.fell && this.dataset.fallbackSrc){this.dataset.fell='1';this.src=this.dataset.fallbackSrc;}">

  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const body = document.body;

    const sunIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.15"/><line x1="12" y1="2.4" x2="12" y2="5.1"/><line x1="12" y1="18.9" x2="12" y2="21.6"/><line x1="2.4" y1="12" x2="5.1" y2="12"/><line x1="18.9" y1="12" x2="21.6" y2="12"/><line x1="5.2" y1="5.2" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.2" y2="18.8"/></svg>`;
    const moonIcon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 14.35A9 9 0 1 1 9.65 3 7.15 7.15 0 0 0 21 14.35z"/></svg>`;

    function setToggleIcon() {
      const isLight = body.classList.contains('light');
      toggleBtn.innerHTML = isLight ? moonIcon : sunIcon;
      toggleBtn.setAttribute('aria-label', isLight ? 'Dark mode' : 'Light mode');
    }

    function updateSocialIcons() {
      const isLight = body.classList.contains('light');
      const mode = isLight ? 'light' : 'dark';
      document.querySelectorAll('.icon').forEach(icon => {
        const img = icon.querySelector('img');
        const newSrc = icon.getAttribute(`data-${mode}`);
        if (newSrc && img) img.src = newSrc;
      });
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('light');
      setToggleIcon();
      updateSocialIcons();
    });

    setToggleIcon();
    updateSocialIcons();

    const modeToggle = document.getElementById('modeToggle');
    const VIEWS = ['follow', 'join', 'connect'];
    const viewTabs = {
      follow: document.getElementById('tab-follow'),
      join: document.getElementById('tab-join'),
      connect: document.getElementById('tab-connect')
    };

    const sliderEl = document.getElementById('toggleSlider');
    const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let jellyAnim = null;

    function spring(t, k, w) {
      return 1 - Math.exp(-k * t) * (Math.cos(w * t) + (k / w) * Math.sin(w * t));
    }

    function jellySlide(fromL, fromR, toL, toR) {
      if (!sliderEl || !sliderEl.animate) return;
      const movingRight = toL >= fromL;
      const innerW = modeToggle.clientWidth;
      const frames = [];
      const N = 180;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const lead = spring(t, 9, 11.5);
        const trail = spring(t, 7, 7.2);
        let L, R;
        if (movingRight) {
          R = fromR + (toR - fromR) * lead;
          L = fromL + (toL - fromL) * trail;
        } else {
          L = fromL + (toL - fromL) * lead;
          R = fromR + (toR - fromR) * trail;
        }
        L = Math.max(0, L);
        R = Math.min(innerW, R);
        const squash = 0.15 * Math.sin(Math.PI * t) + 0.05 * Math.exp(-5 * t) * Math.sin(20 * t) * (1 - t);
        frames.push({
          left: L + 'px',
          width: Math.max(0, R - L) + 'px',
          transform: 'scaleY(' + (1 - squash).toFixed(4) + ')'
        });
      }
      frames[N] = { left: toL + 'px', width: (toR - toL) + 'px', transform: 'scaleY(1)' };
      jellyAnim = sliderEl.animate(frames, { duration: 650, easing: 'linear' });
      const mine = jellyAnim;
      mine.onfinish = mine.oncancel = () => { if (jellyAnim === mine) jellyAnim = null; };
    }

    function syncSlider(animate) {
      if (!modeToggle || !sliderEl) return;
      const active = modeToggle.querySelector('.toggle-option.active') || viewTabs.follow;
      const toL = active.offsetLeft;
      const toW = active.offsetWidth;

      let fromL = null, fromR = null;
      if (animate === true && !(reduceMotion && reduceMotion.matches)) {
        const sr = sliderEl.getBoundingClientRect();
        const tr = modeToggle.getBoundingClientRect();
        fromL = sr.left - tr.left - modeToggle.clientLeft;
        fromR = fromL + sr.width;
      }

      if (jellyAnim) { jellyAnim.cancel(); jellyAnim = null; }
      modeToggle.style.setProperty('--slider-l', toL + 'px');
      modeToggle.style.setProperty('--slider-w', toW + 'px');

      if (fromL !== null && (Math.abs(fromL - toL) > 0.5 || Math.abs(fromR - (toL + toW)) > 0.5)) {
        jellySlide(fromL, fromR, toL, toL + toW);
      }
    }

    const socialRow = document.querySelector('.social-row');

    function stampColumnDelays() {
      if (!socialRow) return;
      const items = Array.from(socialRow.querySelectorAll('.social-item:not([style*="display: none"])'));
      // Only visible ones in current view
      const visibleItems = items.filter(el => {
        const group = el.closest('.social-group');
        return group && getComputedStyle(group).display !== 'none';
      });
      const ixs = visibleItems.map((el) => Math.round(el.getBoundingClientRect().left));
      const iunique = Array.from(new Set(ixs)).sort((a, b) => a - b);
      visibleItems.forEach((el, i) => {
        const col = iunique.length > 1 ? Math.max(0, iunique.indexOf(ixs[i])) : i;
        el.style.setProperty('--col', String(col));
      });
      // Also for h2 if needed, but mainly items
    }

    function replayViewFade() {
      if (!socialRow) return;
      socialRow.classList.remove('view-entering');
      void socialRow.offsetWidth;
      socialRow.classList.add('view-entering');
      requestAnimationFrame(stampColumnDelays);
    }

    let viewReady = false;

    function setView(view) {
      const next = VIEWS.includes(view) ? view : 'follow';
      const changed = (body.dataset.view || 'follow') !== next;
      body.dataset.view = next;
      modeToggle.classList.toggle('follow', next === 'follow');
      modeToggle.classList.toggle('join', next === 'join');
      modeToggle.classList.toggle('connect', next === 'connect');
      VIEWS.forEach((name) => {
        const tab = viewTabs[name];
        if (!tab) return;
        const on = name === next;
        tab.classList.toggle('active', on);
        tab.classList.toggle('inactive', !on);
        tab.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const hash = '#' + next;
      if (location.hash !== hash) {
        try { history.replaceState(null, '', hash); } catch (err) {}
      }
      const jelly = viewReady && changed;
      requestAnimationFrame(() => syncSlider(jelly));
      if (!viewReady || changed) replayViewFade();
      viewReady = true;
    }

    const startupHeader = document.getElementById('startupHeader');
    const scroller = document.getElementById('scroller');
    let lastCompact = -1;

    function compactRangePx() {
      const raw = getComputedStyle(document.documentElement).getPropertyValue('--compact-range').trim();
      const n = parseFloat(raw);
      return Number.isFinite(n) ? n : 160;
    }

    function syncProfileClip() {
      const img = document.querySelector('.profile-image');
      const toggle = document.getElementById('modeToggle');
      if (!img || !toggle) return;
      const ir = img.getBoundingClientRect();
      const cut = toggle.getBoundingClientRect().bottom;
      const fade = 28;
      if (cut >= ir.bottom - 0.5) {
        img.style.opacity = '1';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      if (cut <= ir.top + 0.5) {
        img.style.opacity = '0';
        img.style.webkitMaskImage = 'none';
        img.style.maskImage = 'none';
        return;
      }
      img.style.opacity = '1';
      const solid = Math.max(0, cut - ir.top - fade);
      const end = Math.max(0, cut - ir.top);
      const mask = 'linear-gradient(to bottom, #000 0, #000 ' + solid + 'px, transparent ' + end + 'px, transparent 100%)';
      img.style.webkitMaskImage = mask;
      img.style.maskImage = mask;
    }

    function measureChrome() {
      if (!startupHeader) return;
      const divider = startupHeader.querySelector('.divider');
      const edge = divider || startupHeader;
      const h = Math.ceil(edge.getBoundingClientRect().bottom);
      document.documentElement.style.setProperty('--chrome-expanded', Math.max(0, h) + 'px');
    }

    function scrollYNow() {
      return scroller ? scroller.scrollTop : window.scrollY;
    }

    function syncHeroCompact() {
      const range = Math.max(1, compactRangePx());
      const y = scrollYNow();
      const tval = Math.min(1, Math.max(0, y / range));
      const rounded = tval.toFixed(4);
      if (rounded !== lastCompact) {
        lastCompact = rounded;
        document.documentElement.style.setProperty('--hero-compact', rounded);
        syncProfileClip();
        measureChrome();
      }
    }

    if (scroller) {
      scroller.addEventListener('scroll', () => {
        requestAnimationFrame(syncHeroCompact);
      }, { passive: true });
    }
    if (startupHeader && scroller) {
      startupHeader.addEventListener('wheel', (e) => {
        scroller.scrollTop += e.deltaY;
      }, { passive: true });
    }
    window.addEventListener('resize', () => {
      measureChrome();
      syncProfileClip();
      if (typeof syncSlider === 'function') syncSlider();
    });
    measureChrome();
    syncHeroCompact();
    if (window.ResizeObserver && startupHeader) {
      new ResizeObserver(() => measureChrome()).observe(startupHeader);
    }

    requestAnimationFrame(syncSlider);

    document.querySelectorAll('.mode-toggle .toggle-option').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
      const i = VIEWS.indexOf(body.dataset.view || 'follow');
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        setView(VIEWS[(i + 1) % VIEWS.length]);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setView(VIEWS[(i - 1 + VIEWS.length) % VIEWS.length]);
      }
    });

    function viewFromHash() {
      const name = (location.hash || '#follow').slice(1);
      return VIEWS.includes(name) ? name : 'follow';
    }

    window.addEventListener('hashchange', () => setView(viewFromHash()));
    window.addEventListener('resize', syncSlider);
    setView(viewFromHash());
    requestAnimationFrame(syncSlider);
  </script>
</body>
</html>
